[project]
name = "poe2-ritual-helper"
version = "0.1.0"
description = "Offline-first Path of Exile 2 Ritual computer vision helper."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "keyboard>=0.13.5",
  "pillow>=11.0.0",
  "pydantic>=2.10.0",
  "tzdata>=2026.1",
  "typing-extensions>=4.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
]

[project.scripts]
ritual-helper = "ritual_helper.main:main"
ritual-helper-gui = "ritual_helper.gui:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
